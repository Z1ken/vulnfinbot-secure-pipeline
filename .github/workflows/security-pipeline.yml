name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Run application tests
        run: python -m pytest -v tests/test_app.py

      - name: Run AI security tests
        run: python -m pytest -v tests/test_ai_security.py

      - name: Prepare reports
        run: mkdir -p reports

      - name: Bandit SAST
        continue-on-error: true
        run: |
          bandit -r app/ -f json \
            -o reports/bandit-report.json

      - name: Semgrep SAST
        continue-on-error: true
        run: |
          semgrep scan --metrics=off \
            --config security/semgrep/rules.yml \
            --json \
            --output reports/semgrep-report.json app/

      - name: Dependency audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt \
            -f json -o reports/dependency-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Trivy container scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:0.76.2 \
            image --exit-code 0 --format json \
            --output /reports/trivy-report.json \
            vulnfinbot:latest

      - name: OWASP ZAP DAST
        continue-on-error: true
        run: |
          docker network create vulnfinbot-scan
          docker run -d --name vulnfinbot-ci             --network vulnfinbot-scan             -p 127.0.0.1:5001:5000             vulnfinbot:latest
          curl --fail --retry 15 --retry-delay 1             --retry-connrefused             http://127.0.0.1:5001/health
          chmod a+rwx reports
          docker run --rm             --network vulnfinbot-scan             -v "$PWD/reports:/zap/wrk/:rw"             ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py             -t http://vulnfinbot-ci:5000/             -J zap-report.json -I

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
